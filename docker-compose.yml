# RecallAI — Local Development Infrastructure
# (PROMPT §11 Phase 1, §3 stack: PostgreSQL 16 + pgvector, Redis 7)
#
# Brings up the two stateful services the API + worker depend on for local dev:
#   - postgres: PostgreSQL 16 with pgvector, uuid-ossp, pg_trgm, pg_stat_statements
#   - redis:    Redis 7 (BullMQ queues + ElastiCache parity)
#
# Connection strings (match the .env.example files):
#   DATABASE_URL=postgresql://recallai:recallai@localhost:5432/recallai?schema=public
#   REDIS_URL=redis://localhost:6379
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Reset:   docker compose down -v   (deletes the data volume)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recallai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recallai
      POSTGRES_PASSWORD: recallai
      POSTGRES_DB: recallai
      # pg_stat_statements must be preloaded to be usable (§3 Database extensions).
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c log_statement=none
      -c log_min_duration_statement=500
    ports:
      - "5432:5432"
    volumes:
      - recallai_pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U recallai -d recallai && psql -U recallai -d recallai -c 'SELECT extname FROM pg_extension WHERE extname IN (\"pgvector\",\"uuid-ossp\",\"pg_trgm\",\"pg_stat_statements\")' -tA | sort | tr '\\n' ' '",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: recallai-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - recallai_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recallai_pgdata:
    name: recallai_pgdata
  recallai_redisdata:
    name: recallai_redisdata
