# RecallAI — CI Pipeline (PROMPT §11 Phase 1).
# Runs on every PR and push to main: lint, typecheck, test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Lint ────────────────────────────────────────────────────────
      - name: Lint
        run: pnpm lint

      # ── Typecheck ──────────────────────────────────────────────────
      - name: Typecheck
        run: pnpm typecheck

      # ── Test ──────────────────────────────────────────────────────
      - name: Test
        run: pnpm test

      # ── Build ──────────────────────────────────────────────────────
      - name: Build
        run: pnpm build
